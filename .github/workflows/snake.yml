name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # har kuni bir marta yangilanadi
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7928ca&color_dots=#ebedf0,#9be9f7,#4fd1e8,#06B6D4,#2563EB
            dist/snake-dark.svg?palette=github-dark&color_snake=#06B6D4&color_dots=#161b22,#1e3a5f,#2563EB,#06B6D4,#7928ca

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
